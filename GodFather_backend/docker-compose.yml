# GodFather full stack — one command: docker compose up
# Requires .env in GodFather_backend/ with Azure OpenAI keys

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: godfather_postgres
    environment:
      POSTGRES_DB: godfather
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d godfather"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: godfather-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: godfather-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godfather-django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SKIP_KNOWLEDGE_AUTO=1
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=godfather
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGVECTOR_ENABLED=true
      - DEBUG_RAG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godfather-celery-worker
    command: celery -A project worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=godfather
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGVECTOR_ENABLED=true
    depends_on:
      - django
      - redis
      - elasticsearch

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godfather-celery-beat
    command: celery -A project beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=godfather
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGVECTOR_ENABLED=true
    depends_on:
      - celery_worker
      - redis

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godfather-flower
    command: celery -A project flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker

volumes:
  elasticsearch_data:
  postgres_data:
