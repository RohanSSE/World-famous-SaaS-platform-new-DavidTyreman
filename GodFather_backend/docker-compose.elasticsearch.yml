# Elasticsearch for GodFather RAG (ai_knowledge + document indexes)
# Start: docker compose -f docker-compose.elasticsearch.yml up -d
# Stop:  docker compose -f docker-compose.elasticsearch.yml down
# UI:    http://localhost:9200

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: godfather-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  elasticsearch_data:
